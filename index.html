<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Cyber Chess — GAYA Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --accent: #00ff88; --accent2: #ff6b35;
            --bg: #05050a; --sq-light: #1c2840; --sq-dark: #0d1520;
            --border: rgba(0,255,136,0.3);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body {
            font-family:'Share Tech Mono',monospace; background:var(--bg); color:#e0e0e0;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            min-height:100vh; overflow:hidden; perspective: 1200px;
        }

        /* TELA DE INTRODUÇÃO */
        #intro-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        .intro-title { font-family: 'Orbitron'; font-size: 3rem; color: var(--accent); text-shadow: 0 0 20px var(--accent); animation: glow 2s infinite; }
        .btn-start { 
            margin-top: 30px; padding: 15px 40px; background: transparent; 
            border: 1px solid var(--accent); color: var(--accent); cursor: pointer;
            font-family: 'Orbitron'; letter-spacing: 3px; transition: 0.3s;
        }
        .btn-start:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 30px var(--accent); }

        /* MOEDA CYBER */
        #coin-box { display: none; margin-top: 20px; text-align: center; }
        .coin { width: 80px; height: 80px; border: 4px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 10px auto; transition: 1s transform; transform-style: preserve-3d; }
        .flipping { animation: flip 1s infinite linear; }
        @keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }

        /* JOGO */
        #game-ui { display: none; opacity: 0; transition: 1s opacity; flex-direction: column; align-items: center; }
        .game-container { display: flex; gap: 30px; align-items: center; transform-style: preserve-3d; }
        
        /* TABULEIRO 3D */
        #board { 
            display: grid; grid-template-columns: repeat(8, 65px); 
            border: 4px solid var(--border); box-shadow: 0 0 50px rgba(0,255,136,0.1);
            transform-style: preserve-3d; transition: transform 0.1s ease-out;
        }
        .sq { width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; position: relative; }
        .sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
        .sq.selected { background: rgba(0,255,136,0.4) !important; box-shadow: inset 0 0 15px var(--accent); }
        .sq.moveable::after { content: '●'; font-size: 14px; color: var(--accent2); position: absolute; }
        
        /* GAYA HUD */
        .gaya-hud { border: 1px solid var(--accent); padding: 15px; background: rgba(0,255,136,0.05); backdrop-filter: blur(5px); text-align: center; min-width: 120px; }
        #gaya-face { font-size: 40px; display: block; }
        
        /* BARRA DE VANTAGEM */
        .adv-track { width: 15px; height: 520px; background: #111; border: 1px solid var(--border); border-radius: 10px; position: relative; overflow: hidden; }
        #adv-bar { width: 100%; background: var(--accent); position: absolute; bottom: 0; transition: 0.8s height ease-in-out; }

        /* ANIMAÇÕES */
        @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .glitch-check { animation: shake 0.2s infinite; filter: hue-rotate(90deg); }
        @keyframes shake { 0% { transform: translate(0); } 25% { transform: translate(5px, -5px); } 75% { transform: translate(-5px, 5px); } }

        .particle { position: fixed; pointer-events: none; animation: fly 1s forwards; z-index: 1000; }
        @keyframes fly { to { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div id="intro-screen">
    <h1 class="intro-title">AVANTE, MESTRE</h1>
    <p id="intro-msg">[ SISTEMA GAYA v0.8 AGUARDANDO COMANDO ]</p>
    <button class="btn-start" onclick="showCoinFlip()">INICIALIZAR BATALHA</button>
    
    <div id="coin-box">
        <p>SORTEANDO LADO DA REDE...</p>
        <div id="coin" class="coin">?</div>
        <button id="btn-flip" class="btn-start" onclick="flipCoin()">GIRAR MOEDA</button>
    </div>
</div>

<div id="game-ui">
    <div id="status" style="font-family:'Orbitron'; color:var(--accent); margin-bottom:20px; letter-spacing:3px;">STATUS: OPERACIONAL</div>
    
    <div class="game-container" id="p-container">
        <div class="adv-track"><div id="adv-bar" style="height: 50%;"></div></div>
        
        <div id="board"></div>

        <div class="gaya-hud">
            <span id="gaya-face">🤖</span>
            <div style="font-size:10px; margin-top:5px; color:var(--accent)">GAYA CORE</div>
            <select id="difficulty" style="background:black; color:var(--accent); border:1px solid var(--accent); margin-top:10px; font-size:10px;">
                <option value="easy">MODO: FÁCIL</option>
                <option value="hard">MODO: AGRESSIVO</option>
            </select>
        </div>
    </div>
</div>

<script>
/* --- CONFIGS INICIAIS --- */
const PIECES = {wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
const VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 100 };
let board = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
];
let turn = 'w', playerColor = 'w', selected = null, legalMoves = [];

/* --- SISTEMA DE MOEDA E INÍCIO --- */
function showCoinFlip() {
    document.querySelector('.btn-start').style.display = 'none';
    document.getElementById('coin-box').style.display = 'block';
}

function flipCoin() {
    const coin = document.getElementById('coin');
    const btn = document.getElementById('btn-flip');
    btn.disabled = true;
    coin.classList.add('flipping');
    
    setTimeout(() => {
        coin.classList.remove('flipping');
        playerColor = Math.random() > 0.5 ? 'w' : 'b';
        coin.textContent = playerColor === 'w' ? '♔' : '♚';
        coin.style.color = playerColor === 'w' ? '#00ff88' : '#ff6b35';
        
        setTimeout(() => {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('game-ui').style.display = 'flex';
                setTimeout(() => document.getElementById('game-ui').style.opacity = '1', 100);
                if(playerColor === 'b') setTimeout(gayaMove, 1000);
                render();
            }, 1000);
        }, 1500);
    }, 2000);
}

/* --- MOTOR DE JOGO --- */
const cl = p => p ? p[0] : null;
const tp = p => p ? p.slice(1) : null;

function getRawMoves(r, c, targetBoard) {
    const piece = targetBoard[r][c];
    if (!piece) return [];
    const color = cl(piece), type = tp(piece);
    let moves = [];
    const inB = (nr, nc) => nr >= 0 && nr < 8 && nc >= 0 && nc < 8;

    if (type === 'P') {
        const dir = color === 'w' ? -1 : 1;
        if (inB(r+dir, c) && !targetBoard[r+dir][c]) {
            moves.push([r+dir, c]);
            if (r === (color === 'w' ? 6 : 1) && !targetBoard[r+2*dir][c]) moves.push([r+2*dir, c]);
        }
        [[-1,dir],[1,dir]].forEach(d => {
            let nr = r + d[1], nc = c + d[0];
            if (inB(nr, nc) && targetBoard[nr][nc] && cl(targetBoard[nr][nc]) !== color) moves.push([nr, nc]);
        });
    } else if (type === 'N') {
        [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(m => {
            let nr = r+m[0], nc = c+m[1];
            if (inB(nr, nc) && (!targetBoard[nr][nc] || cl(targetBoard[nr][nc]) !== color)) moves.push([nr, nc]);
        });
    } else {
        let dirs = [];
        if (type==='R' || type==='Q' || type==='K') dirs.push([0,1],[0,-1],[1,0],[-1,0]);
        if (type==='B' || type==='Q' || type==='K') dirs.push([1,1],[-1,-1],[1,-1],[-1,1]);
        dirs.forEach(d => {
            let nr = r + d[0], nc = c + d[1];
            while (inB(nr, nc)) {
                if (!targetBoard[nr][nc]) { moves.push([nr, nc]); if(type==='K') break; nr += d[0]; nc += d[1]; }
                else { if (cl(targetBoard[nr][nc]) !== color) moves.push([nr, nc]); break; }
            }
        });
    }
    return moves;
}

function isCheck(color, targetBoard) {
    let kingPos = null;
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(targetBoard[r][c] === color+'K') kingPos = [r,c];
    if(!kingPos) return false;
    const enemy = color === 'w' ? 'b' : 'w';
    for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
        if(targetBoard[r][c] && cl(targetBoard[r][c]) === enemy) {
            if(getRawMoves(r, c, targetBoard).some(m => m[0] === kingPos[0] && m[1] === kingPos[1])) return true;
        }
    }
    return false;
}

function getLegalMoves(r, c) {
    const raw = getRawMoves(r, c, board);
    return raw.filter(m => {
        const temp = board.map(row => [...row]);
        temp[m[0]][m[1]] = temp[r][c];
        temp[r][c] = null;
        return !isCheck(cl(board[r][c]), temp);
    });
}

/* --- IA GAYA v0.8 --- */
function gayaMove() {
    const gayaColor = playerColor === 'w' ? 'b' : 'w';
    const diff = document.getElementById('difficulty').value;
    let all = [];

    for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
        if(board[r][c] && cl(board[r][c]) === gayaColor) {
            getLegalMoves(r, c).forEach(m => {
                let score = board[m[0]][m[1]] ? VALUES[tp(board[m[0]][m[1]])]*10 : 0;
                if(diff === 'hard') score += (Math.random() * 5);
                all.push({fr:r, fc:c, tr:m[0], tc:m[1], s: score});
            });
        }
    }
    all.sort((a,b) => b.s - a.s);
    if(all.length > 0) setTimeout(() => executeMove(all[0].fr, all[0].fc, all[0].tr, all[0].tc), 800);
    else checkGameOver();
}

function executeMove(fr, fc, tr, tc) {
    const piece = board[fr][fc];
    const captured = board[tr][tc];
    
    board[tr][tc] = piece;
    board[fr][fc] = null;
    turn = turn === 'w' ? 'b' : 'w';

    if(captured && tp(captured) === 'K') {
        victoryEffect(cl(piece) === playerColor ? "VOCÊ VENCEU!" : "GAYA VENCEU!");
    }

    render();
    updateAdvantage();
    updateGayaFace();

    if(turn !== playerColor) gayaMove();
}

/* --- VISUAIS E EFEITOS --- */
function render() {
    const bEl = document.getElementById('board');
    bEl.innerHTML = '';
    const check = isCheck(turn, board);
    if(check) bEl.classList.add('glitch-check'); else bEl.classList.remove('glitch-check');

    for(let r=0; r<8; r++) for(let c=0; c<8; c++) {
        const sq = document.createElement('div');
        sq.className = `sq ${(r+c)%2===0?'light':'dark'}`;
        if(selected && selected[0]===r && selected[1]===c) sq.classList.add('selected');
        if(legalMoves.some(m => m[0]===r && m[1]===c)) sq.classList.add('moveable');
        
        if(board[r][c]) {
            const p = document.createElement('span');
            p.className = `piece ${cl(board[r][c])}`;
            p.textContent = PIECES[board[r][c]];
            sq.appendChild(p);
        }

        sq.onclick = () => {
            if(turn !== playerColor) return;
            if(selected && legalMoves.some(m => m[0]===r && m[1]===c)) {
                executeMove(selected[0], selected[1], r, c);
                selected = null; legalMoves = [];
            } else if(board[r][c] && cl(board[r][c]) === playerColor) {
                selected = [r, c];
                legalMoves = getLegalMoves(r, c);
                render();
            }
        };
        bEl.appendChild(sq);
    }
}

function updateAdvantage() {
    let w=0, b=0;
    board.flat().forEach(p => { if(p) cl(p)==='w' ? w+=VALUES[tp(p)] : b+=VALUES[tp(p)]; });
    const pct = (w+b === 0) ? 50 : (w/(w+b))*100;
    document.getElementById('adv-bar').style.height = pct + '%';
}

function updateGayaFace() {
    const face = document.getElementById('gaya-face');
    if(isCheck(playerColor === 'w' ? 'b' : 'w', board)) face.textContent = '😈';
    else if(isCheck(playerColor, board)) face.textContent = '🤣';
    else face.textContent = '🤖';
}

// EFEITO TILT 3D
document.addEventListener('mousemove', (e) => {
    const board = document.getElementById('board');
    const x = (window.innerWidth / 2 - e.pageX) / 30;
    const y = (window.innerHeight / 2 - e.pageY) / 30;
    board.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
});

// COMEMORAÇÃO
function victoryEffect(msg) {
    document.getElementById('status').textContent = msg;
    for(let i=0; i<100; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = '50%'; p.style.top = '50%';
        p.style.width = '10px'; p.style.height = '10px';
        p.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
        p.style.setProperty('--x', (Math.random()-0.5)*1000 + 'px');
        p.style.setProperty('--y', (Math.random()-0.5)*1000 + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }
    setTimeout(() => location.reload(), 5000);
}
</script>
</body>
</html>
