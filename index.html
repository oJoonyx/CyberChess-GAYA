<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Cyber Chess — GAYA Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --accent: #00ff88; --accent2: #ff6b35;
            --bg: #05050a; --sq-light: #1c2840; --sq-dark: #0d1520;
            --border: rgba(0,255,136,0.3);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body {
            font-family:'Share Tech Mono',monospace; background:var(--bg); color:#e0e0e0;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            min-height:100vh; overflow:hidden;
        }

        /* TELA DE INTRODUÇÃO REFORMULADA */
        #intro-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease; text-align: center; padding: 20px;
        }
        .intro-title { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--accent); text-shadow: 0 0 20px var(--accent); margin-bottom: 30px; }
        
        .setup-box { 
            display: flex; flex-direction: column; gap: 15px; width: 300px; 
            background: rgba(0,255,136,0.05); padding: 25px; border: 1px solid var(--border);
        }
        
        .input-cyber, .select-cyber {
            background: rgba(0,0,0,0.5); border: 1px solid var(--accent); color: var(--accent);
            padding: 12px; font-family: 'Orbitron'; text-align: center; outline: none; font-size: 12px;
        }
        .select-cyber { cursor: pointer; }

        .btn-start { 
            padding: 15px; background: transparent; border: 1px solid var(--accent); 
            color: var(--accent); cursor: pointer; font-family: 'Orbitron'; 
            letter-spacing: 2px; transition: 0.3s; margin-top: 10px;
        }
        .btn-start:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 30px var(--accent); }

        /* MOEDA CYBER */
        #coin-box { display: none; margin-top: 20px; animation: fadeIn 0.5s forwards; }
        .coin { width: 80px; height: 80px; border: 4px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 15px auto; transition: 1s transform; transform-style: preserve-3d; }
        .flipping { animation: flip 1s infinite linear; }

        /* JOGO UI */
        #game-ui { display: none; opacity: 0; transition: 1s opacity; flex-direction: column; align-items: center; }
        #timer-container { width: 100%; height: 6px; background: #111; margin-bottom: 15px; overflow: hidden; border: 1px solid #222; }
        #timer-bar { width: 100%; height: 100%; background: var(--accent2); transition: width 1s linear; box-shadow: 0 0 10px var(--accent2); }

        .game-container { display: flex; gap: 30px; align-items: center; perspective: 1000px; }
        .adv-track { width: 14px; height: 520px; background: #111; border: 1px solid var(--border); border-radius: 10px; position: relative; overflow: hidden; }
        #adv-bar { width: 100%; background: var(--accent); position: absolute; bottom: 0; transition: 0.8s height ease; }

        /* TABULEIRO */
        #board { display: grid; grid-template-columns: repeat(8, 65px); border: 4px solid var(--border); transform-style: preserve-3d; background: #000; }
        .sq { width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; position: relative; transform-style: preserve-3d; }
        .sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
        .sq.selected { background: rgba(0,255,136,0.3) !important; box-shadow: inset 0 0 15px var(--accent); }
        .sq.moveable::after { content: '●'; font-size: 14px; color: var(--accent2); position: absolute; opacity: 0.6; }

        /* EFEITO 3D NAS PEÇAS */
        .piece { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s; z-index: 2; cursor: pointer; user-select: none; }
        .piece:hover { transform: translateZ(40px) scale(1.25); filter: drop-shadow(0 15px 20px rgba(0,255,136,0.7)); }
        .piece.w { color: #fff; filter: drop-shadow(0 0 5px var(--accent)); }
        .piece.b { color: #fff; filter: drop-shadow(0 0 5px var(--accent2)); }

        /* HUD */
        .cyber-panel { border: 1px solid var(--accent); padding: 20px; background: rgba(0,255,136,0.05); backdrop-filter: blur(5px); text-align: center; min-width: 150px; }
        #gaya-face { font-size: 45px; display: block; margin-bottom: 10px; }
        .label { font-size: 10px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }

        @keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glitch-check { animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(0); } 25% { transform: translate(3px,-3px); } 75% { transform: translate(-3px,3px); } }
        .particle { position: fixed; pointer-events: none; animation: fly 1s forwards; }
        @keyframes fly { to { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div id="intro-screen">
    <h1 class="intro-title">AVANTE, MESTRE</h1>
    
    <div id="setup-area" class="setup-box">
        <label class="label">Identificação</label>
        <input type="text" id="player-name" class="input-cyber" placeholder="NOME DO OPERADOR" maxlength="12">
        
        <label class="label">Nível de Expansão</label>
        <select id="difficulty-setup" class="select-cyber">
            <option value="60">FÁCIL (60s)</option>
            <option value="30">AGRESSIVO (30s)</option>
            <option value="10">PROFISSIONAL (10s)</option>
        </select>
        
        <button class="btn-start" onclick="confirmSetup()">CONFIRMAR CONFIGS</button>
    </div>

    <div id="coin-box">
        <p class="label" style="font-size:14px">SORTEANDO LADO DA REDE...</p>
        <div id="coin" class="coin">?</div>
        <button id="btn-flip" class="btn-start" onclick="flipCoin()">GIRAR MOEDA</button>
    </div>
</div>

<div id="game-ui">
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="status" style="font-family:'Orbitron'; color:var(--accent); margin-bottom:15px; letter-spacing:3px;">SISTEMA OPERACIONAL OK</div>
    
    <div class="game-container">
        <div class="adv-track"><div id="adv-bar" style="height: 50%;"></div></div>
        
        <div id="board"></div>

        <div class="cyber-panel">
            <span id="gaya-face">🤖</span>
            <div class="label">Status GAYA</div>
            <div id="diff-display" style="font-size:10px; color:var(--accent2); margin-bottom:15px;">---</div>
            
            <hr style="border:0; border-top:1px solid var(--border); margin: 15px 0;">
            
            <div class="label">Operador</div>
            <div id="display-name" style="font-family:'Orbitron'; color:var(--accent); font-size:14px;">USER</div>
            <div id="countdown-text" style="font-size: 32px; color: var(--accent2); margin-top: 10px; font-weight: bold;">--s</div>
        </div>
    </div>
</div>

<script>
const PIECES = {wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};
const VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 1000 };
let board = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],['wR','wN','wB','wQ','wK','wB','wN','wR']
];
let turn = 'w', playerColor = 'w', selected = null, legalMoves = [];
let timeLeft = 60, timerInterval = null, maxTime = 60;

const cl = p => p ? p[0] : null;
const tp = p => p ? p.slice(1) : null;

// FLUXO DE INÍCIO
function confirmSetup() {
    const name = document.getElementById('player-name').value || "OPERADOR";
    const diff = document.getElementById('difficulty-setup').value;
    
    document.getElementById('display-name').textContent = name;
    maxTime = parseInt(diff);
    document.getElementById('diff-display').textContent = diff == "60" ? "MODO: FÁCIL" : (diff == "30" ? "MODO: AGRESSIVO" : "MODO: PROFISSIONAL");
    
    document.getElementById('setup-area').style.display = 'none';
    document.getElementById('coin-box').style.display = 'block';
}

function flipCoin() {
    const coin = document.getElementById('coin');
    const btn = document.getElementById('btn-flip');
    btn.disabled = true;
    coin.classList.add('flipping');
    
    setTimeout(() => {
        coin.classList.remove('flipping');
        playerColor = Math.random() > 0.5 ? 'w' : 'b';
        coin.textContent = playerColor === 'w' ? '♔' : '♚';
        coin.style.color = playerColor === 'w' ? '#00ff88' : '#ff6b35';
        
        setTimeout(() => {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('game-ui').style.display = 'flex';
                document.getElementById('game-ui').style.opacity = '1';
                startTurn();
                render();
            }, 800);
        }, 1200);
    }, 1500);
}

// SISTEMA DE TEMPO
function startTurn() {
    clearInterval(timerInterval);
    timeLeft = maxTime;
    updateUI();
    if(turn === playerColor) {
        timerInterval = setInterval(() => {
            timeLeft--; updateUI();
            if(timeLeft <= 0) victoryEffect("TIMEOUT! GAYA VENCEU.");
        }, 1000);
    } else { gayaMove(); }
}

function updateUI() {
    document.getElementById('timer-bar').style.width = (timeLeft/maxTime)*100 + "%";
    document.getElementById('countdown-text').textContent = timeLeft + "s";
    document.getElementById('timer-bar').style.background = timeLeft < 5 ? "#ff0000" : "var(--accent2)";
}

// MOTOR DO JOGO
function getRawMoves(r, c, b) {
    const color = cl(b[r][c]), type = tp(b[r][c]);
    let m = []; const inB = (nr, nc) => nr>=0 && nr<8 && nc>=0 && nc<8;
    if(type==='P') {
        const d = color==='w'?-1:1;
        if(inB(r+d,c) && !b[r+d][c]) { m.push([r+d,c]); if(r===(color==='w'?6:1) && !b[r+2*d][c]) m.push([r+2*d,c]); }
        [[-1,d],[1,d]].forEach(p => { if(inB(r+p[1],c+p[0]) && b[r+p[1]][c+p[0]] && cl(b[r+p[1]][c+p[0]])!==color) m.push([r+p[1],c+p[0]]); });
    } else if(type==='N') {
        [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(p => { if(inB(r+p[0],c+p[1]) && (!b[r+p[0]][c+p[1]] || cl(b[r+p[0]][c+p[1]])!==color)) m.push([r+p[0],c+p[1]]); });
    } else {
        let ds = [];
        if(type==='R'||type==='Q'||type==='K') ds.push([0,1],[0,-1],[1,0],[-1,0]);
        if(type==='B'||type==='Q'||type==='K') ds.push([1,1],[-1,-1],[1,-1],[-1,1]);
        ds.forEach(d => {
            let nr=r+d[0], nc=c+d[1];
            while(inB(nr,nc)) {
                if(!b[nr][nc]) { m.push([nr,nc]); if(type==='K') break; nr+=d[0]; nc+=d[1]; }
                else { if(cl(b[nr][nc])!==color) m.push([nr,nc]); break; }
            }
        });
    }
    return m;
}

function isCheck(color, b) {
    let k = null;
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(b[r][c]===color+'K') k=[r,c];
    if(!k) return false;
    const enemy = color==='w'?'b':'w';
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(b[r][c] && cl(b[r][c])===enemy) if(getRawMoves(r,c,b).some(m=>m[0]===k[0]&&m[1]===k[1])) return true;
    return false;
}

function getLegalMoves(r,c) {
    return getRawMoves(r,c,board).filter(m => {
        const temp = board.map(row => [...row]);
        temp[m[0]][m[1]] = temp[r][c]; temp[r][c] = null;
        return !isCheck(cl(board[r][c]), temp);
    });
}

// IA GAYA v0.95
function gayaMove() {
    const gColor = playerColor==='w'?'b':'w';
    let all = [];
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
        if(board[r][c] && cl(board[r][c])===gColor) {
            getLegalMoves(r,c).forEach(m => {
                let s = board[m[0]][m[1]] ? VALUES[tp(board[m[0]][m[1]])]*15 : 0;
                // Lógica de segurança básica
                const enemy = playerColor;
                for(let i=0;i<8;i++) for(let j=0;j<8;j++) if(board[i][j] && cl(board[i][j])===enemy) if(getRawMoves(i,j,board).some(em=>em[0]===m[0]&&em[1]===m[1])) s -= (VALUES[tp(board[r][c])]*10);
                all.push({fr:r,fc:c,tr:m[0],tc:m[1],s:s+Math.random()});
            });
        }
    }
    all.sort((a,b)=>b.s-a.s);
    if(all[0]) setTimeout(()=>executeMove(all[0].fr,all[0].fc,all[0].tr,all[0].tc), 1000);
}

function executeMove(fr,fc,tr,tc) {
    const target = board[tr][tc];
    if(target && tp(target)==='K') { victoryEffect(cl(board[fr][fc])===playerColor?"CORE INIMIGO DESTRUIDO!":"GAYA DESTRUIU SEU CORE."); return; }
    board[tr][tc]=board[fr][fc]; board[fr][fc]=null;
    turn = turn==='w'?'b':'w';
    render(); updateAdvantage(); updateGayaFace(); startTurn();
}

function render() {
    const bEl = document.getElementById('board'); bEl.innerHTML = '';
    if(isCheck(turn,board)) bEl.classList.add('glitch-check'); else bEl.classList.remove('glitch-check');
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
        const sq = document.createElement('div'); sq.className = `sq ${(r+c)%2===0?'light':'dark'}`;
        if(selected && selected[0]===r && selected[1]===c) sq.classList.add('selected');
        if(legalMoves.some(m=>m[0]===r && m[1]===c)) sq.classList.add('moveable');
        if(board[r][c]) {
            const p = document.createElement('span'); p.className = `piece ${cl(board[r][c])}`;
            p.textContent = PIECES[board[r][c]]; sq.appendChild(p);
        }
        sq.onclick = () => {
            if(turn!==playerColor) return;
            if(selected && legalMoves.some(m=>m[0]===r&&m[1]===c)) { executeMove(selected[0],selected[1],r,c); selected=null; legalMoves=[]; }
            else if(board[r][c] && cl(board[r][c])===playerColor) { selected=[r,c]; legalMoves=getLegalMoves(r,c); render(); }
        };
        bEl.appendChild(sq);
    }
}

function updateAdvantage() {
    let w=0, b=0;
    board.flat().forEach(p=>{ if(p) cl(p)==='w'?w+=VALUES[tp(p)]:b+=VALUES[tp(p)]; });
    document.getElementById('adv-bar').style.height = (w+b===0?50:(w/(w+b))*100)+'%';
}

function updateGayaFace() {
    const f = document.getElementById('gaya-face');
    if(isCheck(playerColor, board)) f.textContent = '😈';
    else if(isCheck(playerColor==='w'?'b':'w', board)) f.textContent = '😰';
    else f.textContent = '🤖';
}

function victoryEffect(m) {
    clearInterval(timerInterval); document.getElementById('status').textContent = m;
    document.getElementById('status').style.color = "#ff0000";
    for(let i=0;i<80;i++) {
        const p=document.createElement('div'); p.className='particle';
        p.style.left='50%'; p.style.top='50%'; p.style.width='8px'; p.style.height='8px';
        p.style.background=`hsl(${Math.random()*360},100%,50%)`;
        p.style.setProperty('--x',(Math.random()-0.5)*1200+'px'); p.style.setProperty('--y',(Math.random()-0.5)*1200+'px');
        document.body.appendChild(p); setTimeout(()=>p.remove(),1200);
    }
    setTimeout(() => location.reload(), 5000);
}
</script>
</body>
</html>
